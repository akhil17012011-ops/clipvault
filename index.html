<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/clip-vault-logo.png" />
  <link rel="apple-touch-icon" href="/clip-vault-logo.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#160B33" />
  <meta name="description" content="Clip Vault — the UGC clipping network. Brands launch campaigns, creators clip, post and get paid per view on TikTok, Instagram Reels and YouTube Shorts." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Clip Vault — Clip. Post. Get Paid." />
  <meta property="og:description" content="The UGC clipping network. Brands launch campaigns, creators clip, post and get paid per view." />
  <meta property="og:image" content="/clip-vault-logo.png" />
  <meta name="twitter:card" content="summary" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap"
    rel="stylesheet"
  />
  <title>Clip Vault — Clip. Post. Get Paid.</title>
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem("clipvault.theme");
      if (
        t === "dark" ||
        (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      }
    } catch (e) {}
  </script>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
